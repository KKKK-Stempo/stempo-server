name: "Setup Java and Gradlew"
description: "Sets up Java environment, restores JDK cache, and prepares Gradlew"

inputs:
  java-distribution:
    description: "Java distribution to set up"
    required: true
    type: string
  java-version:
    description: "Java version to set up (8, 11, 16, 17, 21)"
    required: true
    type: string
  java-package:
    description: "Java package type (jdk, jre, jdk+fx, jre+fx)"
    required: false
    default: "jdk"
    type: string
outputs: {}

runs:
  using: "composite"
  steps:
    - name: Prepare Cache Key Variables
      id: prepare-cache-key
      run: |
        DISTRIBUTION="${{ inputs.java-distribution }}"
        VERSION="${{ inputs.java-version }}"
        PACKAGE="${{ inputs.java-package }}"
        DISTRIBUTION_CAPITALIZED="$(echo "${DISTRIBUTION:0:1}" | tr '[:lower:]' '[:upper:]')${DISTRIBUTION:1}"
        
        CACHE_PATH="/opt/hostedtoolcache/Java_${DISTRIBUTION_CAPITALIZED}_${PACKAGE}/${VERSION}*/x64"
        CACHE_KEY="java-${DISTRIBUTION}-${VERSION}-${PACKAGE}"
        
        echo "CACHE_PATH=${CACHE_PATH}" >> $GITHUB_ENV
        echo "CACHE_KEY=${CACHE_KEY}" >> $GITHUB_ENV
      shell: bash

    - name: Restore JDK Cache
      uses: actions/cache@v4
      with:
        path: ${{ env.CACHE_PATH }}
        key: ${{ env.CACHE_KEY }}
        restore-keys: |
          java-${{ inputs.java-distribution }}-${{ inputs.java-version }}-
          java-${{ inputs.java-distribution }}-

    - name: Set up Java
      uses: actions/setup-java@v4
      with:
        distribution: ${{ inputs.java-distribution }}
        java-version: ${{ inputs.java-version }}
        java-package: ${{ inputs.java-package }}
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
      shell: bash
