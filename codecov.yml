coverage:
  precision: 2
  round: down
  range: '70...100'
  status:
    project:
      default:
        target: auto
        threshold: 1%
        flags:
          - stempo-api
          - stempo-application
          - stempo-auth
          - stempo-common
          - stempo-domain
          - stempo-infrastructure
    patch:
      default:
        target: auto
        threshold: 1%

flags:
  stempo-api:
    paths:
      - 'stempo-api/src/**'
  stempo-application:
    paths:
      - 'stempo-application/src/**'
  stempo-auth:
    paths:
      - 'stempo-auth/src/**'
  stempo-common:
    paths:
      - 'stempo-common/src/**'
  stempo-domain:
    paths:
      - 'stempo-domain/src/**'
  stempo-infrastructure:
    paths:
      - 'stempo-infrastructure/src/**'

comment:
  layout: 'diff, flags, files'
  behavior: default
  require_changes: true
  require_base: false
  require_head: false
  hide_project_coverage: false

codecov:
  notify:
    require_ci_to_pass: true
  require_ci_to_pass: true

exclude:
  - '**/Test*.java'
  - '**/*Test*.java'
  - '**/*Dto*.java'
  - '**/*Entity*.java'
  - '**/*Service*.java'
  - '**/*Repository*.java'
  - '**/*Exception*.java'
  - '**/ApiApplication.java'

max_report_age: '30d'
mode: all
