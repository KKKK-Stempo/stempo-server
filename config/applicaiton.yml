spring:
    application:
        name: ${APPLICATION_NAME:stempo-core}
    profiles:
        active: ${SPRING_PROFILES_ACTIVE:dev}
    cloud:
        config:
            uri: ${CONFIG_SERVER_URI}
            profile: ${spring.profiles.active}
            fail-fast: ${CONFIG_FAIL_FAST:true}
            retry:
                initial-interval: 1000
                max-attempts: 6
                max-interval: 2000
                multiplier: 1.1
            request-connect-timeout: ${CONFIG_CONNECT_TIMEOUT:5000}
            request-read-timeout: ${CONFIG_READ_TIMEOUT:10000}
            username: ${CONFIG_SERVER_USERNAME}
            password: ${CONFIG_SERVER_PASSWORD}
    config:
        import:
            - optional:configserver:${CONFIG_SERVER_URI}
            - optional:file:${SECRETS_FILE_PATH:./config/secrets.yml}
